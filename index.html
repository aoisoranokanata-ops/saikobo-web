<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彩工房">
<title>彩工房 Web</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 作品ギャラリー -->
<section id="gallery" class="screen">
  <header class="gal-head">
    <h1><img src="icons/icon-192.png" alt="" class="logo">彩工房</h1>
    <div class="gal-actions">
      <button id="galNew" class="btn primary">＋ 新規</button>
      <button id="galPhoto" class="btn">写真から</button>
      <button id="galMenu" class="btn icon" aria-label="その他">⋯</button>
    </div>
  </header>
  <div id="galGrid" class="gal-grid"></div>
  <p id="galEmpty" class="gal-empty" hidden>まだ作品がありません。「＋ 新規」か「写真から」で始めましょう。</p>
  <footer class="gal-foot"><span id="galStorage"></span><span id="appVersion"></span></footer>
</section>

<!-- 編集画面 -->
<section id="editor" class="screen" hidden>
  <header id="topbar">
    <button class="tb-btn" id="btnBack" aria-label="作品一覧へ">‹ 作品</button>
    <nav id="menubar">
      <button class="tb-btn" data-menu="file">ファイル</button>
      <button class="tb-btn" data-menu="edit">編集</button>
      <button class="tb-btn" data-menu="image">イメージ</button>
      <button class="tb-btn" data-menu="adjust">色調補正</button>
      <button class="tb-btn" data-menu="layer">レイヤー</button>
      <button class="tb-btn" data-menu="select">選択範囲</button>
      <button class="tb-btn" data-menu="filter">フィルター</button>
      <button class="tb-btn" data-menu="view">表示</button>
    </nav>
    <div class="tb-title"><span id="docTitle"></span><button id="saveState" class="save-state" hidden title="保存を再試行中">● 未保存</button></div>
    <div class="tb-right">
      <button class="tb-btn icon" id="btnUndo" aria-label="取り消し" title="取り消し（2本指タップ）">↶</button>
      <button class="tb-btn icon" id="btnRedo" aria-label="やり直し" title="やり直し（3本指タップ）">↷</button>
      <button class="tb-btn icon" id="btnSide" aria-label="パネルの表示切替" title="パネル">▤</button>
    </div>
  </header>
  <div id="optbar"></div>
  <div id="main">
    <nav id="toolbar" aria-label="ツール"></nav>
    <div id="viewport">
      <canvas id="view"></canvas>
      <div id="zoomBadge" class="badge" hidden></div>
      <div id="hint" class="hint" hidden></div>
      <div id="adjPanel" class="adj-panel" hidden></div>
    </div>
    <aside id="side">
      <div class="side-tabs">
        <button class="side-tab on" data-tab="layers">レイヤー</button>
        <button class="side-tab" data-tab="color">カラー</button>
        <button class="side-tab" data-tab="history">ヒストリー</button>
      </div>
      <div class="side-body" id="tab-layers">
        <div class="layer-props">
          <select id="lyBlend" aria-label="描画モード"></select>
          <label class="op">不透明度 <input type="range" id="lyOpacity" min="0" max="100" value="100"><span id="lyOpacityV">100%</span></label>
          <div class="lock-row">
            <label><input type="checkbox" id="lyAlphaLock"> 透明部分をロック</label>
            <label><input type="checkbox" id="lyLock"> すべてロック</label>
          </div>
        </div>
        <ul id="layerList" class="layer-list"></ul>
        <div class="layer-btns">
          <button data-cmd="layer.new" title="新規レイヤー">＋</button>
          <button data-cmd="layer.duplicate" title="複製">⧉</button>
          <button data-cmd="layer.up" title="上へ">▲</button>
          <button data-cmd="layer.down" title="下へ">▼</button>
          <button data-cmd="layer.mergeDown" title="下と結合">⤓</button>
          <button data-cmd="layer.delete" title="削除">🗑</button>
        </div>
      </div>
      <div class="side-body" id="tab-color" hidden>
        <div class="picker">
          <canvas id="svBox" width="240" height="180"></canvas>
          <canvas id="hueBar" width="240" height="22"></canvas>
          <div class="picker-row">
            <div id="pickSwatch" class="swatch big"></div>
            <input id="hexInput" maxlength="7" spellcheck="false" autocomplete="off" aria-label="色コード">
            <label class="native-pick" title="システムの色選択"><input type="color" id="nativeColor">…</label>
          </div>
          <div id="recentColors" class="recent"></div>
        </div>
      </div>
      <div class="side-body" id="tab-history" hidden>
        <ol id="historyList" class="history-list"></ol>
      </div>
    </aside>
  </div>
</section>

<div id="menuLayer" class="menu-layer" hidden><div id="menuPop" class="menu-pop" role="menu"></div></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileInput" accept="image/*" class="vh">
<input type="file" id="fileInputAny" class="vh">

<script src="js/util.js"></script>
<script src="js/doc.js"></script>
<script src="js/selection.js"></script>
<script src="js/adjust.js"></script>
<script src="js/layerfx.js"></script>
<script src="js/view.js"></script>
<script src="js/tools.js"></script>
<script src="js/transform.js"></script>
<script src="js/adjustui.js"></script>
<script src="js/layerui.js"></script>
<script src="js/panels.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
